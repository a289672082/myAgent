name: C++20 build and protocol tests
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev ninja-build python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 25
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Debug -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build
        run: cmake --build build --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --timeout 25

      - name: Diagnose Windows C++ test exit codes
        if: always()
        shell: pwsh
        run: |
          foreach ($test in @('protocol', 'extended', 'tasks_schema')) {
            $bin = "build/Debug/mymcp_${test}_tests.exe"
            if (Test-Path $bin) {
              & $bin
              Write-Host "TESTEXIT $test $LASTEXITCODE"
            }
          }
