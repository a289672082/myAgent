name: Console entry (pinned local FTXUI)
on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'console/**', 'sdk/**', 'third_party/FTXUI', '.gitmodules', '.github/workflows/console.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'console/**', 'sdk/**', 'third_party/FTXUI', '.gitmodules', '.github/workflows/console.yml']
  workflow_dispatch:
concurrency:
  group: myagent-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Configure root console using vendored FTXUI
        run: cmake -S . -B build-console -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMYAGENT_BUILD_EXAMPLES=OFF -DMYAGENT_BUILD_TESTS=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build console and offline tests
        run: cmake --build build-console --target myagent_console myagent_console_commands_tests myagent_console_chat_tests --parallel 2
      - name: Run console CTests
        run: ctest --test-dir build-console --output-on-failure --timeout 30
  windows-console:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure root console using vendored FTXUI
        run: cmake -S . -B build-console -A x64 -DMYAGENT_BUILD_EXAMPLES=OFF -DMYAGENT_BUILD_TESTS=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build console and offline tests
        run: cmake --build build-console --config Debug --target myagent_console myagent_console_commands_tests myagent_console_chat_tests --parallel 2
      - name: Run console CTests
        run: ctest --test-dir build-console -C Debug --output-on-failure --timeout 30
