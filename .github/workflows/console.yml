name: Console entry (pinned local FTXUI)
on:
  push:
    branches: [main]
    paths: ['CMakeLists.txt', 'CMakePresets.json', 'myAgent.sln', 'vs2022/**', 'console/**', 'sdk/**', 'tools/**', 'mcp_servers/**', 'mcp/**', 'third_party/FTXUI', '.gitmodules', '.github/workflows/console.yml']
  pull_request:
    paths: ['CMakeLists.txt', 'CMakePresets.json', 'myAgent.sln', 'vs2022/**', 'console/**', 'sdk/**', 'tools/**', 'mcp_servers/**', 'mcp/**', 'third_party/FTXUI', '.gitmodules', '.github/workflows/console.yml']
  workflow_dispatch:
concurrency:
  group: myagent-console-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  linux-console:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libssl-dev
      - name: Configure root console using vendored FTXUI
        run: cmake -S . -B build-console -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMYAGENT_BUILD_EXAMPLES=OFF -DMYAGENT_BUILD_TESTS=OFF -DFETCHCONTENT_FULLY_DISCONNECTED=ON
      - name: Build console and offline tests
        run: cmake --build build-console --target myagent_console myagent_console_commands_tests myagent_console_chat_tests myagent_developer_tools_mcp developer_tools_tests --parallel 2
      - name: Run console CTests
        run: ctest --test-dir build-console --output-on-failure --timeout 30
  windows-console:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Enable VS2022 MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build checked-in native MSBuild C++ console (no CMake or NMake)
        run: msbuild .\\vs2022\\myAgentConsole.vcxproj /t:Build /p:Configuration=Debug /p:Platform=x64 /m:2 /nologo /v:minimal
      - name: Build native MCP demo project directly from its vcxproj
        run: msbuild .\\vs2022\\run_resources_demo.vcxproj /t:Build /p:Configuration=Debug /p:Platform=x64 /m:2 /nologo /v:minimal
      - name: Build the checked-in myAgent.sln directly as a VS2022 solution
        run: msbuild .\\myAgent.sln /t:Build /p:Configuration=Debug /p:Platform=x64 /m:2 /nologo /v:minimal
      - name: Reject legacy NMake and CMD build wrappers in native projects
        run: |
          $projects = Get-ChildItem .\\vs2022\\*.vcxproj
          if ($projects.Count -lt 10) { throw "Missing native Visual C++ projects" }
          $legacy = Select-String -Path $projects.FullName -Pattern 'NMakeBuildCommandLine|ConfigurationType>Makefile|build.cmd|cmake --build'
          if ($legacy) { throw "Native VS project still delegates compilation to command scripts" }
      - name: Generate VS2022 native solution using the checked-in CMake preset
        run: |
          cmake --preset vs2022-console -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          if (-not (Test-Path "build-vs2022/native-console/myAgentConsole.sln")) {
            throw "CMake did not generate the expected VS2022 solution"
          }
      - name: Build console from generated VS2022 solution
        run: cmake --build --preset vs2022-console-debug --parallel 2
      - name: Validate MCP SDK native CMake target
        run: cmake --build build-vs2022/native-console --config Debug --target mymcp --parallel 2
      - name: Compile offline console regression targets in the same build tree
        run: cmake --build build-vs2022/native-console --config Debug --target myagent_console_commands_tests myagent_console_chat_tests myagent_developer_tools_mcp developer_tools_tests --parallel 2
      - name: Run console CTests
        run: ctest --test-dir build-vs2022/native-console -C Debug --output-on-failure --timeout 30
