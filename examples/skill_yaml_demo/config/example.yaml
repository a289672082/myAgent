# 普通 YAML 配置示例（不是 SKILL.md frontmatter）。
# 该文件只供离线 Demo 展示 yaml-cpp 解析，所有值均为示意，不需要 API Key。
application:
  name: "myAgent YAML 使用示例"
  version: "1.0"
  verbose: true

model:
  name: "gpt-4.1-mini"
  base_url: "https://api.openai.com"
  append_responses_path: true

skills:
  auto_discover: true
  directories:
    - "./skills"
    - "./.agents/skills"
    - "./.claude/skills"
  policies:
    code-review:
      enabled: true
      priority: 10

instructions: |
  你是一个 C++ 开发助手。
  用户需要代码审查时，先查看匹配的 Skill。
  不要自动执行 Skill 附带的脚本。
